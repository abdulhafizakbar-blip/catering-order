<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order — KZ Catering</title>
<style>
  :root {
    --gold:    #b8922a;
    --gold-lt: #d4a83a;
    --bg:      #f8f6f1;
    --white:   #ffffff;
    --line:    #e8e0d0;
    --text:    #1a1612;
    --muted:   #7a6e5f;
    --dark:    #2a2318;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--dark); padding: 14px 16px; text-align: center; }
  .header-logo { font-weight: 900; font-size: 1.1rem; color: var(--gold-lt);
    letter-spacing: .06em; text-decoration: none; display: block; }
  .header-sub { font-size: .72rem; color: rgba(255,255,255,.45); margin-top: 2px; }

  /* ── MAIN ── */
  .main { max-width: 560px; margin: 0 auto; padding: 18px 16px 140px; }

  /* ── CARD ── */
  .card { background: var(--white); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .card-title { font-size: .67rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px; }
  .card-title::before { content: ""; width: 16px; height: 1px; background: var(--gold); flex-shrink: 0; }

  /* ── FORM ── */
  label { display: block; font-size: .77rem; font-weight: 600; color: var(--muted);
    letter-spacing: .03em; margin-bottom: 5px; }
  input, textarea {
    width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--line); border-radius: 7px; font-size: .9rem;
    outline: none; transition: border-color .15s; font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--gold); background: #fffef8; }
  input::placeholder, textarea::placeholder { color: #c2b49e; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .req { color: #d03; }

  /* ── SESSION BUTTONS ── */
  .sess-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sess-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 16px 6px;
    background: var(--white); border: 2px solid var(--line);
    border-radius: 14px; cursor: pointer; transition: all .2s;
    position: relative; text-align: center; user-select: none;
  }
  .sess-btn:hover { border-color: var(--gold); background: #fffef8; }
  .sess-btn.confirmed { border-color: var(--gold); background: #fffbee; }
  .sess-emoji { font-size: 1.8rem; line-height: 1; }
  .sess-name { font-size: .72rem; font-weight: 800; color: var(--text); letter-spacing: .04em; text-transform: uppercase; }
  .sess-sub  { font-size: .62rem; color: var(--muted); }
  .sess-badge {
    position: absolute; top: -7px; right: -7px;
    background: var(--gold); color: #fff;
    font-size: .58rem; font-weight: 900;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; display: none;
    align-items: center; justify-content: center;
  }
  .sess-btn.confirmed .sess-badge { display: flex; }

  /* ── SESSION SUMMARY (below buttons) ── */
  .summ-block { display: none; }
  .summ-block.visible { display: block; }
  .summ-sess { background: var(--white); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .summ-sess-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .summ-sess-lbl { font-size: .7rem; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); }
  .summ-edit { background: none; border: none; font-size: .7rem; color: var(--gold);
    cursor: pointer; font-weight: 700; text-decoration: underline; padding: 0; }
  .summ-grp { font-size: .61rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
  .summ-item { display: flex; justify-content: space-between; align-items: center;
    font-size: .83rem; padding: 3px 0; gap: 8px; }
  .summ-item::before { content: "·"; color: var(--gold); font-size: 1rem; flex-shrink: 0; line-height: 1; }
  .summ-item-name { flex: 1; color: var(--text); }
  .summ-item-price { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .summ-subtotal { display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .summ-subtotal-lbl { font-size: .74rem; color: var(--muted); }
  .summ-subtotal-amt { font-size: .95rem; font-weight: 800; color: var(--gold); }

  .grand-card { background: var(--dark); border-radius: 12px; padding: 14px 16px;
    display: none; }
  .grand-card.visible { display: flex; justify-content: space-between; align-items: center; }
  .grand-lbl { font-size: .75rem; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .08em; }
  .grand-amt { font-size: 1.25rem; font-weight: 900; color: var(--gold-lt); }

  /* ── MODAL OVERLAY ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.52);
    z-index: 100; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }

  /* ── DIALOG SHEET ── */
  .sheet { background: var(--white); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 560px; max-height: 92vh;
    display: flex; flex-direction: column; overflow: hidden; }
  .sheet-hd { padding: 14px 18px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .sheet-title { font-size: .96rem; font-weight: 800; color: var(--text); }
  .sheet-close { background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--muted); padding: 0; line-height: 1; flex: 0; }
  .sheet-body { flex: 1; overflow-y: auto; }
  .sheet-ft { padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; flex-shrink: 0; background: var(--white); }
  .btn-reset   { flex: 1; background: none; border: 1.5px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 12px; font-size: .88rem; font-weight: 700;
    cursor: pointer; transition: .15s; }
  .btn-reset:hover { border-color: var(--muted); color: var(--text); }
  .btn-confirm { flex: 2; background: var(--gold); color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: .88rem; font-weight: 800;
    cursor: pointer; transition: .15s; }
  .btn-confirm:hover { background: var(--dark); }

  /* ── DIALOG MENU ITEMS ── */
  .dlg-sec-hd { font-size: .66rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); padding: 14px 16px 8px;
    background: var(--bg); display: flex; align-items: center; gap: 8px; }
  .dlg-sec-hd::before { content: ""; width: 12px; height: 1px; background: var(--gold); flex-shrink: 0; }
  .opt-pill { font-size: .57rem; background: #fff8ec; border: 1px solid rgba(184,146,42,.2);
    color: var(--gold); padding: 2px 6px; border-radius: 3px; }
  .dlg-grp-lbl { font-size: .61rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); padding: 8px 16px 4px; background: var(--bg); }
  .dlg-item { display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--white); cursor: pointer; transition: background .12s; }
  .dlg-item:last-of-type { border-bottom: none; }
  .dlg-item:hover { background: #fffdf7; }
  .dlg-item.checked { background: #fffbee; }
  .dlg-cb { width: 22px; height: 22px; flex-shrink: 0;
    border: 1.5px solid #d0c4a8; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transition: .15s; background: var(--bg); pointer-events: none; }
  .dlg-item.checked .dlg-cb { background: var(--gold); border-color: var(--gold); }
  .dlg-cb::after { content: "✓"; color: #fff; font-size: .72rem;
    font-weight: 900; opacity: 0; transition: opacity .1s; }
  .dlg-item.checked .dlg-cb::after { opacity: 1; }
  .dlg-info { flex: 1; min-width: 0; pointer-events: none; }
  .dlg-name  { font-weight: 600; font-size: .88rem; color: var(--text); }
  .dlg-sub   { font-size: .71rem; color: var(--muted); margin-top: 2px; font-style: italic; }
  .dlg-price { font-size: .78rem; font-weight: 700; color: var(--gold); margin-top: 2px; }

  /* ── BOTTOM BAR ── */
  .bar { position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--white); border-top: 2px solid var(--line);
    padding: 12px 16px; z-index: 20; box-shadow: 0 -4px 18px rgba(0,0,0,.08); }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .bar-info  { line-height: 1.35; }
  .bar-count { font-size: .71rem; color: var(--muted); }
  .bar-total { font-size: .98rem; font-weight: 900; color: var(--gold); }
  .btn-send { background: var(--gold); color: #fff; border: 0; padding: 13px 20px;
    border-radius: 8px; font-size: .88rem; font-weight: 800; cursor: pointer;
    letter-spacing: .04em; transition: .15s; flex: 1; }
  .btn-send:hover { background: var(--dark); }
  .btn-send:disabled { opacity: .32; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <a class="header-logo" href="https://abdulhafizakbar-blip.github.io/kz-catering-website/">KZ Catering</a>
  <div class="header-sub">Your Taste is Our Priority</div>
</div>

<div class="main">

  <!-- ── CUSTOMER DETAILS ── -->
  <div class="card">
    <div class="card-title">Maklumat Anda</div>
    <div class="field"><label>Nama <span class="req">*</span></label>
      <input id="name" placeholder="e.g. Ahmad bin Hassan"></div>
    <div class="field"><label>No. Telefon <span class="req">*</span></label>
      <input id="phone" type="tel" placeholder="e.g. 0123456789" inputmode="tel"></div>
    <div class="row2">
      <div class="field"><label>Tarikh <span class="req">*</span></label>
        <input id="date" type="date"></div>
      <div class="field"><label>Masa</label>
        <input id="time" type="time"></div>
    </div>
    <div class="field"><label>Alamat Penghantaran <span style="font-weight:400;color:var(--muted)">(kosong = ambil sendiri)</span></label>
      <textarea id="address" rows="2" placeholder="Alamat, bandar, nota untuk pemandu"></textarea></div>
    <div class="field"><label>Nota Tambahan</label>
      <textarea id="notes" rows="2" placeholder="Alahan, pembungkusan, permintaan khas..."></textarea></div>
  </div>

  <!-- ── SESSION SELECTOR ── -->
  <div class="card">
    <div class="card-title">Pilih Sesi Makan</div>
    <div class="sess-row">
      <div class="sess-btn" id="sbtn-breakfast" onclick="openDialog('breakfast')">
        <span class="sess-emoji">🌅</span>
        <span class="sess-name">Sarapan</span>
        <span class="sess-sub">Breakfast</span>
        <span class="sess-badge" id="sbadge-breakfast">0</span>
      </div>
      <div class="sess-btn" id="sbtn-lunch" onclick="openDialog('lunch')">
        <span class="sess-emoji">☀️</span>
        <span class="sess-name">Tengahari</span>
        <span class="sess-sub">Lunch</span>
        <span class="sess-badge" id="sbadge-lunch">0</span>
      </div>
      <div class="sess-btn" id="sbtn-teatime" onclick="openDialog('teatime')">
        <span class="sess-emoji">🍵</span>
        <span class="sess-name">Petang</span>
        <span class="sess-sub">Tea Break</span>
        <span class="sess-badge" id="sbadge-teatime">0</span>
      </div>
      <div class="sess-btn" id="sbtn-servis" onclick="openDialog('servis')">
        <span class="sess-emoji">⭐</span>
        <span class="sess-name">Servis Lain</span>
        <span class="sess-sub">Other Services</span>
        <span class="sess-badge" id="sbadge-servis">0</span>
      </div>
    </div>
  </div>

  <!-- ── ORDER SUMMARY ── -->
  <div class="summ-block" id="summ-block">
    <div class="card-title" style="margin-bottom:12px">Ringkasan Pesanan</div>

    <div id="summ-breakfast"></div>
    <div id="summ-lunch"></div>
    <div id="summ-teatime"></div>
    <div id="summ-servis"></div>

    <div class="grand-card" id="grand-card">
      <span class="grand-lbl">Jumlah Keseluruhan</span>
      <span class="grand-amt" id="grand-amt">RM 0.00</span>
    </div>
  </div>

</div>

<!-- ── SESSION DIALOG ── -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-hd">
      <span class="sheet-title" id="dlg-title"></span>
      <button class="sheet-close" onclick="closeDialog()">✕</button>
    </div>
    <div class="sheet-body" id="dlg-body"></div>
    <div class="sheet-ft">
      <button class="btn-reset"   onclick="resetDialog()">Reset</button>
      <button class="btn-confirm" onclick="confirmDialog()">Sahkan Pilihan</button>
    </div>
  </div>
</div>

<!-- ── BOTTOM BAR ── */
<div class="bar">
  <div class="bar-inner">
    <div class="bar-info">
      <div class="bar-count" id="bar-count">0 item dipilih</div>
      <div class="bar-total" id="bar-total">RM 0.00</div>
    </div>
    <button class="btn-send" id="btn-send" disabled>Order via WhatsApp</button>
  </div>
</div>

const RM = "RM";

const MENU = {

const SESSIONS = {
  breakfast: {
    emoji: "🌅", label: "Sarapan / Breakfast",
    sections: [
      { key: "b-makan",      title: "Makan" },
      { key: "b-addon",      title: "Add On", optional: true },
      { key: "b-drink",      title: "Air / Minuman" },
      { key: "b-drink-addon",title: "Add On Minuman", optional: true },
    ],
  },
  lunch: {
    emoji: "☀️", label: "Tengahari / Lunch",
    sections: [
      { key: "l-nasi",   title: "Nasi" },
      { key: "l-ayam",   title: "Ayam" },
      { key: "l-daging", title: "Daging" },
      { key: "l-ikan",   title: "Ikan" },
      { key: "l-sayur",  title: "Sayur" },
      { key: "l-salad",  title: "Salad & Ulam" },
      { key: "l-sambal", title: "Sambal" },
      { key: "l-buah",   title: "Buah" },
      { key: "l-air",    title: "Air / Minuman" },
    ],
  },
  teatime: {
    emoji: "🍵", label: "Minum Petang / Tea Break",
    sections: [
      { key: "t-makan", title: "Makan" },
      { key: "t-drink", title: "Air / Minuman" },
    ],
  },
  servis: {
    emoji: "⭐", label: "Servis Lain / Other Services",
    sections: [
      { key: "s-main", title: "Perkhidmatan" },
      {
        type: "info", title: "Perkhidmatan Kami",
        items: [
          "Set Buffet Premium — Pinggan, Cawan, Sudu & Garfu (Pakai Buang)",
          "Plastik Sampah",
          "Tisu",
        ],
      },
    ],
  },
};

// confirmed[session] = { "key-idx": true, ... }
const confirmed = { breakfast: {}, lunch: {}, teatime: {}, servis: {} };
let activeSession = null;
let tempState = {};

// ── OPEN DIALOG ──
function openDialog(sess) {
  activeSession = sess;
  tempState = { ...confirmed[sess] };

  const cfg = SESSIONS[sess];
  document.getElementById("dlg-title").textContent = cfg.emoji + "  " + cfg.label;

  const body = document.getElementById("dlg-body");
  body.innerHTML = "";

  cfg.sections.forEach(sec => {
    // ── INFO SECTION (non-selectable) ──
    if (sec.type === "info") {
      const hd = document.createElement("div");
      hd.className = "dlg-sec-hd";
      hd.textContent = sec.title;
      body.appendChild(hd);
      const card = document.createElement("div");
      card.style.cssText = "margin: 4px 16px 8px; padding: 12px 14px; background: #fffbee; border: 1px solid #e8e0d0; border-radius: 8px;";
      card.innerHTML = sec.items.map(t =>
        `<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.83rem;color:#1a1612">
           <span style="color:#b8922a;flex-shrink:0;margin-top:1px">✦</span>
           <span>${t}</span>
         </div>`
      ).join("");
      body.appendChild(card);
      return;
    }

    const items = MENU[sec.key];
    if (!items?.length) return;

    const hd = document.createElement("div");
    hd.className = "dlg-sec-hd";
    hd.innerHTML = sec.title + (sec.optional ? ` <span class="opt-pill">Optional</span>` : "");
    body.appendChild(hd);

    let lastGroup = null;
    items.forEach((item, i) => {
      const id = `${sec.key}-${i}`;

      if (item.group && item.group !== lastGroup) {
        lastGroup = item.group;
        const gl = document.createElement("div");
        gl.className = "dlg-grp-lbl";
        gl.textContent = item.group;
        body.appendChild(gl);
      }

      const row = document.createElement("div");
      row.className = "dlg-item" + (tempState[id] ? " checked" : "");
      row.innerHTML = `
        <div class="dlg-cb"></div>
        <div class="dlg-info">
          <div class="dlg-name">${item.name}</div>
          ${item.sub ? `<div class="dlg-sub">${item.sub}</div>` : ""}
          <div class="dlg-price">${RM} ${item.price.toFixed(2)}</div>
        </div>`;
      row.addEventListener("click", () => {
        tempState[id] = !tempState[id];
        row.classList.toggle("checked", tempState[id]);
      });
      body.appendChild(row);
    });
  });

  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDialog() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  activeSession = null;
}

function resetDialog() {
  tempState = {};
  document.querySelectorAll(".dlg-item.checked").forEach(r => r.classList.remove("checked"));
}

function confirmDialog() {
  confirmed[activeSession] = { ...tempState };
  closeDialog();
  renderSummaries();
  updateBar();
}

// close on backdrop click
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeDialog();
});

// ── HELPERS ──
function getItems(sess) {
  const cfg = SESSIONS[sess];
  return cfg.sections.flatMap(sec =>
    (MENU[sec.key] || [])
      .map((item, i) => ({ ...item, key: sec.key, secTitle: sec.title, i }))
      .filter(item => confirmed[sess][`${item.key}-${item.i}`])
  );
}

function allItems() {
  return Object.keys(SESSIONS).flatMap(s => getItems(s));
}

// ── RENDER SUMMARIES ──
function renderSummaries() {
  let anyVisible = false;

  Object.entries(SESSIONS).forEach(([sess, cfg]) => {
    const items = getItems(sess);
    const badge = document.getElementById(`sbadge-${sess}`);
    const sbtn  = document.getElementById(`sbtn-${sess}`);
    const el    = document.getElementById(`summ-${sess}`);

    if (!items.length) {
      sbtn.classList.remove("confirmed");
      el.innerHTML = "";
      return;
    }

    anyVisible = true;
    sbtn.classList.add("confirmed");
    badge.textContent = items.length;

    let html = `<div class="summ-sess">
      <div class="summ-sess-hd">
        <span class="summ-sess-lbl">${cfg.emoji} ${cfg.label}</span>
        <button class="summ-edit" onclick="openDialog('${sess}')">Edit</button>
      </div>`;

    let lastSec = null;
    items.forEach(it => {
      if (it.secTitle !== lastSec) {
        html += `<div class="summ-grp">${it.secTitle}</div>`;
        lastSec = it.secTitle;
      }
      html += `<div class="summ-item">
        <span class="summ-item-name">${it.name}</span>
        <span class="summ-item-price">${RM} ${it.price.toFixed(2)}</span>
      </div>`;
    });

    const sub = items.reduce((s, it) => s + it.price, 0);
    html += `<div class="summ-subtotal">
      <span class="summ-subtotal-lbl">Subtotal</span>
      <span class="summ-subtotal-amt">${RM} ${sub.toFixed(2)}</span>
    </div></div>`;
    el.innerHTML = html;
  });

  const block = document.getElementById("summ-block");
  block.classList.toggle("visible", anyVisible);

  const all  = allItems();
  const gt   = all.reduce((s, it) => s + it.price, 0);
  const gc   = document.getElementById("grand-card");
  gc.classList.toggle("visible", all.length > 0);
  document.getElementById("grand-amt").textContent = `${RM} ${gt.toFixed(2)}`;
}

// ── BAR ──
function updateBar() {
  const all = allItems();
  const count = all.length;
  const total = all.reduce((s, it) => s + it.price, 0);
  document.getElementById("bar-count").textContent = count > 0 ? `${count} item dipilih` : "0 item dipilih";
  document.getElementById("bar-total").textContent  = count > 0 ? `${RM} ${total.toFixed(2)}` : "RM 0.00";
  document.getElementById("btn-send").disabled = count === 0;
}

// ── DATE/TIME FORMAT ──
function fmtDate(v) { if (!v) return ""; const [y,m,d] = v.split("-"); return `${d}-${m}-${y}`; }
function fmtTime(v) {
  if (!v) return "";
  const [h,mn] = v.split(":"); const hr = +h;
  return `${hr%12||12}:${mn} ${hr>=12?"PM":"AM"}`;
}

// ── WHATSAPP MESSAGE ──
function buildMsg() {
  const name    = document.getElementById("name").value.trim();
  const phone   = document.getElementById("phone").value.trim();
  const date    = document.getElementById("date").value;
  const time    = document.getElementById("time").value;
  const address = document.getElementById("address").value.trim();
  const notes   = document.getElementById("notes").value.trim();

  const L = ["*Pesanan Baru — KZ Catering*", ""];
  if (name)  L.push(`Nama: ${name}`);
  if (phone) L.push(`Telefon: ${phone}`);
  if (date)  L.push(`Tarikh: ${fmtDate(date)}${time ? ", " + fmtTime(time) : ""}`);
  L.push(address ? `Penghantaran: ${address}` : "Ambil Sendiri");

  Object.entries(SESSIONS).forEach(([sess, cfg]) => {
    const items = getItems(sess);
    if (!items.length) return;
    L.push("", `*${cfg.emoji} ${cfg.label}*`);
    let lastSec = null;
    items.forEach(it => {
      if (it.secTitle !== lastSec) { L.push(`_${it.secTitle}_`); lastSec = it.secTitle; }
      L.push(`• ${it.name} — ${RM} ${it.price.toFixed(2)}`);
    });
  });

  const gt = allItems().reduce((s, it) => s + it.price, 0);
  L.push("", `*Jumlah: ${RM} ${gt.toFixed(2)}*`);
  if (notes) L.push("", `Nota: ${notes}`);
  return L.join("\n");
}

document.getElementById("btn-send").addEventListener("click", () => {
  const phone = document.getElementById("phone").value.trim();
  const date  = document.getElementById("date").value;
  if (!phone) { alert("No. telefon diperlukan."); document.getElementById("phone").focus(); return; }
  const digits = phone.replace(/\D/g,"");
  if (digits.length < 9 || digits.length > 12) {
    alert("Sila masukkan no. telefon Malaysia yang sah (cth: 0123456789).");
    document.getElementById("phone").focus(); return;
  }
  if (!date) { alert("Sila pilih tarikh."); document.getElementById("date").focus(); return; }
  if (!allItems().length) { alert("Sila pilih sekurang-kurangnya satu hidangan."); return; }
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(buildMsg())}`, "_blank");
});

updateBar();
</script>
