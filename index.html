<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order — KZ Catering</title>
<style>
  :root {
    --gold:     #b8922a;
    --gold-lt:  #d4a83a;
    --gold-dim: rgba(184,146,42,.1);
    --bg:       #f8f6f1;
    --white:    #ffffff;
    --card:     #ffffff;
    --line:     #e8e0d0;
    --text:     #1a1612;
    --muted:    #7a6e5f;
    --black2:   #2a2318;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--black2); border-bottom: 1px solid rgba(184,146,42,.3);
    padding: 14px 16px; text-align: center; position: sticky; top: 0; z-index: 20; }
  .header-logo { font-weight: 900; font-size: 1.1rem; color: var(--gold-lt);
    letter-spacing: .06em; text-decoration: none; display: block; }
  .header-sub { font-size: .72rem; color: rgba(255,255,255,.5); margin-top: 2px; letter-spacing: .04em; }

  /* ── SESSION TABS ── */
  .session-tabs { display: flex; background: var(--white);
    border-bottom: 2px solid var(--line); position: sticky; top: 58px; z-index: 19; }
  .s-tab { flex: 1; padding: 12px 6px; text-align: center; cursor: pointer;
    border-bottom: 3px solid transparent; color: var(--muted);
    font-size: .78rem; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; transition: .15s; line-height: 1.3; }
  .s-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .s-tab .s-emoji { display: block; font-size: 1.1rem; margin-bottom: 3px; }

  /* ── LAYOUT ── */
  .session-page { display: none; padding: 16px; max-width: 560px; margin: 0 auto; padding-bottom: 130px; }
  .session-page.active { display: block; }

  /* ── SUBSECTION ── */
  .subsection { margin-bottom: 20px; }
  .sub-header { font-size: .68rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); padding: 10px 0 8px;
    display: flex; align-items: center; gap: 8px; }
  .sub-header::before { content: ""; width: 16px; height: 1px; background: var(--gold); flex-shrink: 0; }
  .sub-header .opt-tag { font-size: .6rem; background: #fff8ec; border: 1px solid var(--gold-dim);
    color: var(--gold); padding: 2px 7px; border-radius: 3px; margin-left: 4px; }
  .sub-divider { height: 1px; background: var(--line); margin-bottom: 8px; }
  .sub-group-label { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding: 8px 14px 4px; font-weight: 600; background: #f8f6f1; }

  /* ── MENU ITEM (CHECKBOX) ── */
  .item { display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    background: var(--white); cursor: pointer; transition: background .15s; }
  .item:first-child { border-radius: 8px 8px 0 0; }
  .item:last-child  { border-radius: 0 0 8px 8px; border-bottom: none; }
  .item:first-child:last-child { border-radius: 8px; }
  .item:hover { background: #fffdf7; }
  .item.checked { background: #fffbee; }
  .item .info { flex: 1; min-width: 0; pointer-events: none; }
  .item .iname { font-weight: 600; font-size: .88rem; color: var(--text); }
  .item .iinfo { font-size: .72rem; color: var(--muted); margin-top: 2px; line-height: 1.4; font-style: italic; }
  .item .iprice { font-size: .78rem; font-weight: 700; color: var(--gold); margin-top: 2px; }

  /* ── CUSTOM CHECKBOX ── */
  .cb-box {
    width: 22px; height: 22px; flex-shrink: 0;
    border: 1.5px solid #d0c4a8; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transition: .15s; background: var(--bg); pointer-events: none;
  }
  .item.checked .cb-box { background: var(--gold); border-color: var(--gold); }
  .cb-box::after { content: "✓"; color: #fff; font-size: .75rem;
    font-weight: 900; opacity: 0; transition: opacity .1s; }
  .item.checked .cb-box::after { opacity: 1; }

  /* ── FORM FIELDS ── */
  .fields-card { background: var(--white); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .fields-card-title { font-size: .68rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; }
  .fields-card-title::before { content: ""; width: 16px; height: 1px; background: var(--gold); }
  label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted);
    letter-spacing: .04em; margin-bottom: 5px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--line); border-radius: 6px; font-size: .9rem; outline: none;
    transition: border-color .15s; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); background: #fffef8; }
  input::placeholder, textarea::placeholder { color: #bdb0a0; }
  .field { margin-bottom: 11px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .req { color: #e03; }

  /* ── ORDER SUMMARY ── */
  .summary-card { background: var(--white); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-top: 16px; display: none; }
  .summary-title { font-size: .68rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; }
  .summary-title::before { content: ""; width: 16px; height: 1px; background: var(--gold); }
  .sum-group-label { font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); opacity: .7; margin: 8px 0 4px; }
  .sum-row { display: flex; align-items: center; gap: 8px;
    font-size: .82rem; padding: 3px 0; color: var(--text); }
  .sum-row::before { content: "✓"; color: var(--gold); font-size: .7rem; font-weight: 900; flex-shrink: 0; }
  .sum-total { display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .sum-total-lbl { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .sum-total-amt { font-size: 1.1rem; font-weight: 900; color: var(--gold); }

  /* ── BOTTOM BAR ── */
  .bar { position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--white); border-top: 2px solid var(--line); padding: 12px 16px; z-index: 20;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .bar-info { line-height: 1.3; }
  .bar-count { font-size: .72rem; color: var(--muted); }
  .bar-total { font-size: 1rem; font-weight: 900; color: var(--gold); }
  button { background: var(--gold); color: #fff; border: 0; padding: 13px 20px;
    border-radius: 6px; font-size: .9rem; font-weight: 800; cursor: pointer;
    letter-spacing: .05em; text-transform: uppercase; transition: .15s; flex: 1; }
  button:hover { background: var(--black2); }
  button:disabled { opacity: .3; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <a class="header-logo" href="https://abdulhafizakbar-blip.github.io/kz-catering-website/">KZ Catering</a>
  <div class="header-sub">Your Taste is Our Priority</div>
</div>

<div class="session-tabs">
  <div class="s-tab active" onclick="switchSession('breakfast')">
    <span class="s-emoji">🌅</span>Sarapan
  </div>
  <div class="s-tab" onclick="switchSession('lunch')">
    <span class="s-emoji">☀️</span>Tengahari
  </div>
  <div class="s-tab" onclick="switchSession('teatime')">
    <span class="s-emoji">🌤</span>Petang
  </div>
</div>

<!-- ══ BREAKFAST ══ -->
<div class="session-page active" id="page-breakfast">
  <div style="margin-top:14px">
    <div class="fields-card">
      <div class="fields-card-title">Maklumat Anda</div>
      <div class="field"><label>Nama <span class="req">*</span></label>
        <input id="name" placeholder="e.g. Ahmad bin Hassan"></div>
      <div class="field"><label>No. Telefon <span class="req">*</span></label>
        <input id="phone" type="tel" placeholder="e.g. 0123456789" inputmode="tel"></div>
      <div class="row2">
        <div class="field"><label>Tarikh <span class="req">*</span></label>
          <input id="date" type="date"></div>
        <div class="field"><label>Masa</label>
          <input id="time" type="time"></div>
      </div>
      <div class="field"><label>Alamat Penghantaran <span style="font-weight:400;color:var(--muted)">(kosong = ambil sendiri)</span></label>
        <textarea id="address" rows="2" placeholder="Alamat, bandar, nota untuk pemandu"></textarea></div>
      <div class="field"><label>Nota Tambahan</label>
        <textarea id="notes" rows="2" placeholder="Alahan, pembungkusan, permintaan khas..."></textarea></div>
    </div>

    <div class="subsection">
      <div class="sub-header">Makan</div>
      <div class="sub-divider"></div>
      <div id="menu-b-makan"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Add On <span class="opt-tag">Optional</span></div>
      <div class="sub-divider"></div>
      <div id="menu-b-addon"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Minuman</div>
      <div class="sub-divider"></div>
      <div id="menu-b-drink"></div>
    </div>
    <div class="summary-card" id="summary-breakfast">
      <div class="summary-title">Pilihan Sarapan</div>
      <div id="sum-b-content"></div>
    </div>
  </div>
</div>

<!-- ══ LUNCH ══ -->
<div class="session-page" id="page-lunch">
  <div style="margin-top:14px">
    <div class="subsection">
      <div class="sub-header">Nasi</div>
      <div class="sub-divider"></div>
      <div id="menu-l-nasi"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Ayam</div>
      <div class="sub-divider"></div>
      <div id="menu-l-ayam"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Daging</div>
      <div class="sub-divider"></div>
      <div id="menu-l-daging"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Ikan</div>
      <div class="sub-divider"></div>
      <div id="menu-l-ikan"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Sayur</div>
      <div class="sub-divider"></div>
      <div id="menu-l-sayur"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Salad & Sambal</div>
      <div class="sub-divider"></div>
      <div id="menu-l-sambal"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Buah Premium</div>
      <div class="sub-divider"></div>
      <div id="menu-l-buah"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Air / Minuman</div>
      <div class="sub-divider"></div>
      <div id="menu-l-air"></div>
    </div>
    <div class="summary-card" id="summary-lunch">
      <div class="summary-title">Pilihan Tengahari</div>
      <div id="sum-l-content"></div>
    </div>
  </div>
</div>

<!-- ══ TEA TIME ══ -->
<div class="session-page" id="page-teatime">
  <div style="margin-top:14px">
    <div class="subsection">
      <div class="sub-header">Makan</div>
      <div class="sub-divider"></div>
      <div id="menu-t-makan"></div>
    </div>
    <div class="subsection">
      <div class="sub-header">Minuman</div>
      <div class="sub-divider"></div>
      <div id="menu-t-drink"></div>
    </div>
    <div class="summary-card" id="summary-teatime">
      <div class="summary-title">Pilihan Petang</div>
      <div id="sum-t-content"></div>
    </div>
  </div>
</div>

<!-- ══ BOTTOM BAR ══ -->
<div class="bar">
  <div class="inner">
    <div class="bar-info">
      <div class="bar-count" id="bar-count">0 item dipilih</div>
      <div class="bar-total" id="bar-total">RM 0.00</div>
    </div>
    <button id="send" disabled>Order via WhatsApp</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "601123043649";
  const CURRENCY = "RM";

  // ─────────────────────────────────────────────────────
  // MENU CONFIG — set price: 0.00 means "price TBC"
  // ─────────────────────────────────────────────────────
  const MENU = {
    // ── SARAPAN / BREAKFAST
    "b-makan": [
      { name: "Nasi Lemak Biasa", info: "Beras basmathi, ikan bilis, timun, sambal", price: 0.00 },
      { name: "Mee Goreng",       price: 0.00 },
      { name: "Bihun Goreng",     price: 0.00 },
      { name: "Kue Teow Goreng",  price: 0.00 },
      { name: "Megi Goreng",      price: 0.00 },
    ],
    "b-addon": [
      { name: "Ayam Goreng Tepung",   price: 0.00 },
      { name: "Ayam Goreng Berempah", price: 0.00 },
      { name: "Ayam Goreng Biasa",    price: 0.00 },
      { name: "Ayam Goreng Rendang",  price: 0.00 },
      { name: "Kuih Muih",            price: 0.00 },
    ],
    "b-drink": [
      { name: "Teh",              price: 0.00 },
      { name: "Teh 'O",           price: 0.00 },
      { name: "Kopi 'O",          price: 0.00 },
      { name: "Teh 'O Lemon",     price: 0.00 },
      { name: "Nescafe",          price: 0.00 },
      { name: "Air Mineral 250ml",price: 0.00 },
    ],

    // ── TENGAHARI / LUNCH
    "l-nasi": [
      { name: "Nasi Putih",   price: 0.00 },
      { name: "Nasi Minyak",  price: 0.00 },
      { name: "Nasi Briyani", price: 0.00 },
      { name: "Nasi Tomato",  price: 0.00 },
      { name: "Nasi Ayam",    price: 0.00 },
    ],
    "l-ayam": [
      { name: "Ayam Masak Lemak Cili Api", price: 0.00 },
      { name: "Ayam Masak Merah",          price: 0.00 },
      { name: "Ayam Masak Kari",           price: 0.00 },
      { name: "Ayam Masak Rendang",        price: 0.00 },
    ],
    "l-daging": [
      { name: "Daging Masak Hitam",                  price: 0.00 },
      { name: "Daging Salai Masak Lemak Cili Api",   price: 0.00 },
      { name: "Daging Masak Kari",                   price: 0.00 },
      { name: "Daging Masak Rendang",                price: 0.00 },
    ],
    "l-ikan": [
      { name: "Ikan Keli/Sembilang Goreng Berlada",        price: 0.00 },
      { name: "Ikan Keli/Sembilang Masak Lemak Cili Api",  price: 0.00 },
    ],
    "l-sayur": [
      { name: "Sayur Kangkung Goreng", price: 0.00 },
      { name: "Sayur Campur",          price: 0.00 },
      { name: "Pajeri Nenas",          price: 0.00 },
      { name: "Jelatah",               price: 0.00 },
    ],
    "l-sambal": [
      { name: "Timun (Salad)",   price: 0.00 },
      { name: "Sambal Belacan",  price: 0.00 },
      { name: "Sambal Tempoyak", price: 0.00 },
      { name: "Budu",            price: 0.00 },
    ],
    "l-buah": [
      { name: "Buah Premium (Tembikai + Anggur)", price: 0.00 },
      { name: "Tembikai",   price: 0.00 },
      { name: "Anggur",     price: 0.00 },
      { name: "Strawberi",  price: 0.00 },
    ],
    "l-air": [
      { name: "Air Kordial — Sirap",          group: "Air Kordial",  price: 0.00 },
      { name: "Air Kordial — Anggur",         group: "Air Kordial",  price: 0.00 },
      { name: "Air Kordial — Sarsi",          group: "Air Kordial",  price: 0.00 },
      { name: "Air Premium — Tembikai",       group: "Air Premium",  price: 0.00 },
      { name: "Air Premium — Oren",           group: "Air Premium",  price: 0.00 },
      { name: "Air Premium — Ribena + Laici", group: "Air Premium",  price: 0.00 },
    ],

    // ── MINUM PETANG / TEA TIME
    "t-makan": [
      { name: "Mee Goreng",   price: 0.00 },
      { name: "Mee Kari",     price: 0.00 },
      { name: "Bihun Goreng", price: 0.00 },
      { name: "Bihun Soto",   price: 0.00 },
      { name: "Laksa",        price: 0.00 },
      { name: "Kuih Muih",    price: 0.00 },
    ],
    "t-drink": [
      { name: "Teh",               price: 0.00 },
      { name: "Teh 'O",            price: 0.00 },
      { name: "Kopi 'O",           price: 0.00 },
      { name: "Teh 'O Lemon",      price: 0.00 },
      { name: "Nescafe",           price: 0.00 },
      { name: "Air Mineral 250ml", price: 0.00 },
    ],
  };

  // ─────────────────────────────────────────────────────
  const checked = {}; // key: "sectionKey-index" → bool

  function buildSection(key, containerId) {
    const items = MENU[key];
    const el = document.getElementById(containerId);
    if (!el || !items) return;
    let lastGroup = null;
    items.forEach((item, i) => {
      const id = `${key}-${i}`;
      checked[id] = false;

      // Group label for items with .group
      if (item.group && item.group !== lastGroup) {
        lastGroup = item.group;
        const lbl = document.createElement("div");
        lbl.className = "sub-group-label";
        lbl.textContent = item.group;
        el.appendChild(lbl);
      }

      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="cb-box"></div>
        <div class="info">
          <div class="iname">${item.name.replace(/^Air (Kordial|Premium) — /, "")}</div>
          ${item.info ? `<div class="iinfo">${item.info}</div>` : ""}
          ${item.price > 0 ? `<div class="iprice">${CURRENCY} ${item.price.toFixed(2)}</div>` : ""}
        </div>`;
      row.addEventListener("click", () => {
        checked[id] = !checked[id];
        row.classList.toggle("checked", checked[id]);
        updateAll();
      });
      el.appendChild(row);
    });
  }

  buildSection("b-makan",  "menu-b-makan");
  buildSection("b-addon",  "menu-b-addon");
  buildSection("b-drink",  "menu-b-drink");
  buildSection("l-nasi",   "menu-l-nasi");
  buildSection("l-ayam",   "menu-l-ayam");
  buildSection("l-daging", "menu-l-daging");
  buildSection("l-ikan",   "menu-l-ikan");
  buildSection("l-sayur",  "menu-l-sayur");
  buildSection("l-sambal", "menu-l-sambal");
  buildSection("l-buah",   "menu-l-buah");
  buildSection("l-air",    "menu-l-air");
  buildSection("t-makan",  "menu-t-makan");
  buildSection("t-drink",  "menu-t-drink");

  const SESSION_KEYS = {
    breakfast: ["b-makan","b-addon","b-drink"],
    lunch:     ["l-nasi","l-ayam","l-daging","l-ikan","l-sayur","l-sambal","l-buah","l-air"],
    teatime:   ["t-makan","t-drink"],
  };
  const SECTION_LABELS = {
    "b-makan":"Makan","b-addon":"Add On","b-drink":"Minuman",
    "l-nasi":"Nasi","l-ayam":"Ayam","l-daging":"Daging","l-ikan":"Ikan",
    "l-sayur":"Sayur","l-sambal":"Salad & Sambal","l-buah":"Buah Premium","l-air":"Air / Minuman",
    "t-makan":"Makan","t-drink":"Minuman",
  };

  function getCheckedItems(keys) {
    return keys.flatMap(key =>
      (MENU[key] || [])
        .map((item, i) => ({ ...item, key, idx: i }))
        .filter(item => checked[`${item.key}-${item.idx}`])
    );
  }

  function totalPrice(items) {
    return items.reduce((s, it) => s + it.price, 0);
  }

  function renderSummary(sessionId, contentId, cardId) {
    const keys = SESSION_KEYS[sessionId];
    const card = document.getElementById(cardId);
    const content = document.getElementById(contentId);
    let html = "";
    let hasAny = false;
    keys.forEach(key => {
      const items = getCheckedItems([key]);
      if (!items.length) return;
      hasAny = true;
      html += `<div class="sum-group-label">${SECTION_LABELS[key]}</div>`;
      items.forEach(it => {
        const displayName = it.name.replace(/^Air (Kordial|Premium) — /, "");
        const amt = it.price > 0 ? ` <span style="color:var(--gold);margin-left:auto">${CURRENCY} ${it.price.toFixed(2)}</span>` : "";
        html += `<div class="sum-row"><span style="flex:1">${displayName}</span>${amt}</div>`;
      });
    });
    if (!hasAny) { card.style.display = "none"; return; }
    const total = totalPrice(getCheckedItems(keys));
    html += `<div class="sum-total">
      <span class="sum-total-lbl">Jumlah Sesi</span>
      <span class="sum-total-amt">${total > 0 ? `${CURRENCY} ${total.toFixed(2)}` : "TBC"}</span>
    </div>`;
    content.innerHTML = html;
    card.style.display = "block";
  }

  function updateAll() {
    renderSummary("breakfast", "sum-b-content", "summary-breakfast");
    renderSummary("lunch",     "sum-l-content", "summary-lunch");
    renderSummary("teatime",   "sum-t-content", "summary-teatime");

    const allChecked = Object.values(checked).filter(Boolean).length;
    const allItems   = getCheckedItems(Object.values(SESSION_KEYS).flat());
    const gt         = totalPrice(allItems);

    document.getElementById("bar-count").textContent = `${allChecked} item dipilih`;
    document.getElementById("bar-total").textContent  = gt > 0 ? `${CURRENCY} ${gt.toFixed(2)}` : allChecked > 0 ? "Harga TBC" : "RM 0.00";
    document.getElementById("send").disabled = allChecked === 0;
  }

  function switchSession(id) {
    document.querySelectorAll(".s-tab").forEach((t, i) =>
      t.classList.toggle("active", ["breakfast","lunch","teatime"][i] === id));
    document.querySelectorAll(".session-page").forEach(p => p.classList.remove("active"));
    document.getElementById("page-" + id).classList.add("active");
  }

  function fmtDate(v) { if (!v) return ""; const [y,m,d] = v.split("-"); return `${d}-${m}-${y}`; }
  function fmtTime(v) {
    if (!v) return "";
    const [h,mn] = v.split(":"); const hr = parseInt(h);
    return `${hr%12||12}:${mn} ${hr>=12?"PM":"AM"}`;
  }

  function buildMessage() {
    const name    = document.getElementById("name").value.trim();
    const phone   = document.getElementById("phone").value.trim();
    const date    = document.getElementById("date").value;
    const time    = document.getElementById("time").value;
    const address = document.getElementById("address").value.trim();
    const notes   = document.getElementById("notes").value.trim();

    const lines = ["*Pesanan Baru — KZ Catering*", ""];
    if (name)  lines.push(`Nama: ${name}`);
    if (phone) lines.push(`Telefon: ${phone}`);
    if (date)  lines.push(`Tarikh: ${fmtDate(date)}${time?", "+fmtTime(time):""}`);
    lines.push(address ? `Penghantaran: ${address}` : "Ambil Sendiri");

    const sessionLabels = { breakfast:"🌅 Sarapan", lunch:"☀️ Tengahari", teatime:"🌤 Minum Petang" };
    Object.entries(SESSION_KEYS).forEach(([sess, keys]) => {
      const items = getCheckedItems(keys);
      if (!items.length) return;
      lines.push("", `*${sessionLabels[sess]}*`);
      let lastKey = null;
      items.forEach(it => {
        if (it.key !== lastKey) {
          lines.push(`_${SECTION_LABELS[it.key]}_`);
          lastKey = it.key;
        }
        const displayName = it.name.replace(/^Air (Kordial|Premium) — /, "");
        const amt = it.price > 0 ? ` — ${CURRENCY} ${it.price.toFixed(2)}` : "";
        lines.push(`• ${displayName}${amt}`);
      });
    });

    const gt = totalPrice(getCheckedItems(Object.values(SESSION_KEYS).flat()));
    lines.push("", gt > 0 ? `*Jumlah: ${CURRENCY} ${gt.toFixed(2)}*` : "*Jumlah: TBC (harga belum ditetapkan)*");
    if (notes) lines.push("", `Nota: ${notes}`);
    return lines.join("\n");
  }

  document.getElementById("send").addEventListener("click", () => {
    const phone = document.getElementById("phone").value.trim();
    const date  = document.getElementById("date").value;
    if (!phone) { alert("No. telefon diperlukan."); document.getElementById("phone").focus(); return; }
    const digits = phone.replace(/\D/g,"");
    if (digits.length < 9 || digits.length > 12) {
      alert("Sila masukkan no. telefon Malaysia yang sah (cth: 0123456789).");
      document.getElementById("phone").focus(); return;
    }
    if (!date) { alert("Sila pilih tarikh."); document.getElementById("date").focus(); return; }
    if (!Object.values(checked).some(Boolean)) { alert("Sila pilih sekurang-kurangnya satu hidangan."); return; }
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildMessage())}`, "_blank");
  });

  updateAll();
</script>
</body>
</html>
