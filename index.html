<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order — KZ Catering</title>
<style>
  :root {
    --gold:     #c9a84c;
    --gold-lt:  #f0d080;
    --gold-dim: rgba(201,168,76,.12);
    --black:    #0a0a0a;
    --black2:   #111111;
    --black3:   #1a1a1a;
    --line:     rgba(201,168,76,.2);
    --text:     #f0ead8;
    --muted:    rgba(240,234,216,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--black); color: var(--text); min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--black2); border-bottom: 1px solid var(--line);
    padding: 16px; text-align: center; position: sticky; top: 0; z-index: 10;
  }
  .header-logo { font-weight: 900; font-size: 1.1rem; color: var(--gold);
    letter-spacing: .06em; text-decoration: none; display: block; }
  .header-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }

  /* ── LAYOUT ── */
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }

  h2 { font-size: .72rem; font-weight: 700; letter-spacing: .14em;
       text-transform: uppercase; color: var(--gold); margin: 22px 0 14px;
       display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 20px; height: 1px; background: var(--gold); }

  /* ── FIELDS ── */
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted);
          letter-spacing: .04em; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; padding: 11px 14px;
    background: var(--black2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font-size: .95rem; outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus { border-color: var(--gold); }
  input::placeholder, textarea::placeholder { color: rgba(240,234,216,.25); }
  .field { margin-bottom: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── MENU ITEMS ── */
  .item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item .info { flex: 1; }
  .item .iname { font-weight: 600; font-size: .9rem; }
  .item .iprice { color: var(--gold); font-size: .8rem; font-weight: 700; margin-top: 2px; }
  .qty {
    width: 68px; text-align: center; padding: 8px 6px;
    background: var(--black3); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font-size: .95rem;
  }
  .qty:focus { border-color: var(--gold); outline: none; }

  /* ── TOTAL ── */
  .total-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 18px; padding: 14px 0; border-top: 1px solid var(--line);
  }
  .total-label { font-size: .82rem; color: var(--muted); text-transform: uppercase;
                 letter-spacing: .1em; font-weight: 600; }
  .total-amount { font-size: 1.3rem; font-weight: 900; color: var(--gold); }

  /* ── BOTTOM BAR ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--black2); border-top: 1px solid var(--line); padding: 12px 16px;
  }
  .bar .inner { max-width: 560px; margin: 0 auto; }
  button {
    width: 100%; background: var(--gold); color: var(--black);
    border: 0; padding: 14px; border-radius: 6px;
    font-size: .95rem; font-weight: 800; cursor: pointer;
    letter-spacing: .06em; text-transform: uppercase; transition: background .15s;
  }
  button:hover { background: var(--gold-lt); }
  button:disabled { opacity: .35; cursor: not-allowed; }

  /* ── GOLD DIVIDER ── */
  .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
             margin: 8px 0 20px; }
</style>
</head>
<body>

<div class="header">
  <a class="header-logo" href="https://abdulhafizakbar-blip.github.io/kz-catering-website/">KZ Catering</a>
  <div class="header-sub">Your Taste is Our Priority</div>
</div>

<div class="wrap">

  <h2>Your Details</h2>
  <div class="field">
    <label>Your Name</label>
    <input id="name" placeholder="e.g. Sarah">
  </div>
  <div class="field">
    <label>Phone Number <span style="color:var(--gold)">*</span></label>
    <input id="phone" type="tel" placeholder="e.g. 0123456789" inputmode="tel">
  </div>
  <div class="row2">
    <div class="field">
      <label>Delivery / Pickup Date <span style="color:var(--gold)">*</span></label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label>Time</label>
      <input id="time" type="time">
    </div>
  </div>
  <div class="field">
    <label>Delivery Address <span style="font-weight:400;color:var(--muted)">(leave blank for pickup)</span></label>
    <textarea id="address" rows="2" placeholder="Street, city, notes for driver"></textarea>
  </div>

  <div class="divider"></div>

  <h2>Menu</h2>
  <div id="menu"></div>

  <div class="divider"></div>

  <div class="field">
    <label>Notes</label>
    <textarea id="notes" rows="2" placeholder="Allergies, packaging, special requests..."></textarea>
  </div>

  <div class="total-bar">
    <div class="total-label">Total</div>
    <div class="total-amount" id="total">RM 0.00</div>
  </div>

</div>

<div class="bar">
  <div class="inner">
    <button id="send" disabled>Order via WhatsApp</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "601123043649";
  const CURRENCY = "RM";

  const MENU = [
    { name: "Nasi Lemak Set",     price: 12.00 },
    { name: "Chicken Rendang",    price: 15.50 },
    { name: "Mee Goreng",         price: 10.00 },
    { name: "Fruit Platter (S)",  price: 18.00 },
    { name: "Bottled Water",      price:  2.00 },
  ];

  const qty = MENU.map(() => 0);
  const menuEl = document.getElementById("menu");

  MENU.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="info">
        <div class="iname">${item.name}</div>
        <div class="iprice">${CURRENCY} ${item.price.toFixed(2)} each</div>
      </div>
      <input class="qty" type="number" min="0" value="0" inputmode="numeric">`;
    const input = row.querySelector("input");
    input.addEventListener("input", () => {
      qty[i] = Math.max(0, parseInt(input.value || "0", 10));
      render();
    });
    menuEl.appendChild(row);
  });

  function total() {
    return MENU.reduce((sum, item, i) => sum + item.price * qty[i], 0);
  }

  function render() {
    const t = total();
    document.getElementById("total").textContent = `${CURRENCY} ${t.toFixed(2)}`;
    document.getElementById("send").disabled = t <= 0;
  }

  function buildMessage() {
    const name    = document.getElementById("name").value.trim();
    const phone   = document.getElementById("phone").value.trim();
    const date    = document.getElementById("date").value;
    const time    = document.getElementById("time").value;
    const address = document.getElementById("address").value.trim();
    const notes   = document.getElementById("notes").value.trim();

    const fmtDate = v => { if (!v) return ""; const [y,m,d] = v.split("-"); return `${d}-${m}-${y}`; };
    const fmtTime = v => {
      if (!v) return "";
      const [h, m] = v.split(":"); const hr = parseInt(h);
      return `${hr % 12 || 12}:${m} ${hr >= 12 ? "PM" : "AM"}`;
    };

    const lines = ["*New Catering Order — KZ Catering*", ""];
    if (name)  lines.push(`Name: ${name}`);
    if (phone) lines.push(`Phone: ${phone}`);
    if (date)  lines.push(`Date: ${fmtDate(date)}${time ? ", " + fmtTime(time) : ""}`);
    lines.push(address ? `Delivery: ${address}` : "Pickup");
    lines.push("", "*Items:*");
    MENU.forEach((item, i) => {
      if (qty[i] > 0)
        lines.push(`• ${qty[i]} × ${item.name} — ${CURRENCY} ${(item.price * qty[i]).toFixed(2)}`);
    });
    lines.push("", `*Total: ${CURRENCY} ${total().toFixed(2)}*`);
    if (notes) lines.push("", `Notes: ${notes}`);
    return lines.join("\n");
  }

  document.getElementById("send").addEventListener("click", () => {
    const phone = document.getElementById("phone").value.trim();
    const date  = document.getElementById("date").value;
    const t     = total();

    if (!phone) {
      alert("Phone number is required.");
      document.getElementById("phone").focus();
      return;
    }
    const digits = phone.replace(/\D/g, "");
    if (digits.length < 9 || digits.length > 12) {
      alert("Please enter a valid Malaysian phone number (e.g. 0123456789).");
      document.getElementById("phone").focus();
      return;
    }
    if (!date) {
      alert("Please select a delivery / pickup date.");
      document.getElementById("date").focus();
      return;
    }
    if (t <= 0) {
      alert("Please add at least one item.");
      return;
    }

    const text = encodeURIComponent(buildMessage());
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
  });

  render();
</script>
</body>
</html>
