<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS — KZ Catering</title>
<style>
  :root {
    --gold:    #b8922a;
    --gold-lt: #d4a83a;
    --bg:      #f8f6f1;
    --white:   #ffffff;
    --line:    #e8e0d0;
    --text:    #1a1612;
    --muted:   #7a6e5f;
    --dark:    #2a2318;
    --red:     #cc2200;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background: var(--bg); color: var(--text); }

  /* ── TABS ── */
  .tabs { display: flex; background: var(--dark); border-bottom: 2px solid rgba(184,146,42,.3);
    position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 14px; text-align: center; font-weight: 700; font-size: .9rem;
    cursor: pointer; border-bottom: 3px solid transparent; color: rgba(255,255,255,.45);
    transition: .15s; letter-spacing: .04em; }
  .tab.active { color: var(--gold-lt); border-bottom-color: var(--gold-lt); }

  /* ── PAGES ── */
  .page { display: none; padding: 16px; max-width: 640px; margin: 0 auto; padding-bottom: 100px; }
  .page.active { display: block; }

  /* ── CARD ── */
  .card { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 14px;
    border: 1px solid var(--line); }
  .card h3 { font-size: .68rem; text-transform: uppercase; letter-spacing: .14em;
    color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3::before { content: ""; width: 16px; height: 1px; background: var(--gold); flex-shrink: 0; }

  /* ── FORM FIELDS ── */
  label { display: block; font-weight: 600; font-size: .78rem; margin-bottom: 5px;
    color: var(--muted); letter-spacing: .03em; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 7px; font-size: .9rem; background: var(--bg);
    color: var(--text); outline: none; transition: border-color .15s; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); background: #fffef8; }
  input::placeholder, textarea::placeholder { color: #c2b49e; }
  .field { margin-bottom: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── SESSION BUTTONS ── */
  .sess-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sess-btn {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 14px 6px;
    background: var(--bg); border: 1.5px solid var(--line);
    border-radius: 12px; cursor: pointer; transition: all .2s;
    position: relative; text-align: center; user-select: none;
  }
  .sess-btn:hover { border-color: var(--gold); background: #fffef8; }
  .sess-btn.confirmed { border-color: var(--gold); background: #fffbee; }
  .sess-emoji { font-size: 1.7rem; line-height: 1; }
  .sess-name { font-size: .7rem; font-weight: 800; color: var(--text); letter-spacing: .04em; text-transform: uppercase; }
  .sess-sub  { font-size: .6rem; color: var(--muted); }
  .sess-badge {
    position: absolute; top: -7px; right: -7px;
    background: var(--gold); color: #fff; font-size: .58rem; font-weight: 900;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; display: none; align-items: center; justify-content: center;
  }
  .sess-btn.confirmed .sess-badge { display: flex; }

  /* ── DIALOG SHEET ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 100; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: var(--white); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 640px; max-height: 92vh;
    display: flex; flex-direction: column; overflow: hidden; }
  .sheet-hd { padding: 14px 18px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .sheet-title { font-size: .96rem; font-weight: 800; color: var(--text); }
  .sheet-close-btn { background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--muted); padding: 0; line-height: 1; }
  .sheet-close-btn:hover { color: var(--text); }
  .sheet-body { flex: 1; overflow-y: auto; }
  .sheet-ft { padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; flex-shrink: 0; background: var(--white); }
  .btn-sheet-reset   { flex: 1; background: none; border: 1.5px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 12px; font-size: .88rem; font-weight: 700; cursor: pointer; transition: .15s; }
  .btn-sheet-reset:hover { border-color: var(--muted); color: var(--text); }
  .btn-sheet-confirm { flex: 2; background: var(--gold); color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: .88rem; font-weight: 800; cursor: pointer; transition: .15s; }
  .btn-sheet-confirm:hover { background: var(--dark); }

  /* ── DIALOG MENU ITEMS ── */
  .dlg-sec-hd { font-size: .66rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); padding: 12px 16px 8px;
    background: var(--bg); display: flex; align-items: center; gap: 8px; }
  .dlg-sec-hd::before { content: ""; width: 12px; height: 1px; background: var(--gold); flex-shrink: 0; }
  .opt-pill { font-size: .57rem; background: #fff8ec; border: 1px solid rgba(184,146,42,.2);
    color: var(--gold); padding: 2px 6px; border-radius: 3px; }
  .dlg-grp-lbl { font-size: .61rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); padding: 8px 16px 4px; background: var(--bg); }
  .dlg-item { display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--white); cursor: pointer; transition: background .12s; }
  .dlg-item:last-of-type { border-bottom: none; }
  .dlg-item:hover { background: #fffdf7; }
  .dlg-item.checked { background: #fffbee; }
  .dlg-cb { width: 22px; height: 22px; flex-shrink: 0;
    border: 1.5px solid #d0c4a8; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transition: .15s; background: var(--bg); pointer-events: none; }
  .dlg-item.checked .dlg-cb { background: var(--gold); border-color: var(--gold); }
  .dlg-cb::after { content: "✓"; color: #fff; font-size: .72rem;
    font-weight: 900; opacity: 0; transition: opacity .1s; }
  .dlg-item.checked .dlg-cb::after { opacity: 1; }
  .dlg-info { flex: 1; min-width: 0; pointer-events: none; }
  .dlg-name  { font-weight: 600; font-size: .88rem; color: var(--text); }
  .dlg-sub   { font-size: .71rem; color: var(--muted); margin-top: 2px; font-style: italic; }
  .dlg-price { font-size: .75rem; font-weight: 700; color: var(--gold); margin-top: 2px; }
  .dlg-warning { display: none; background: #fff3cd; border: 1px solid #f0c040;
    color: #7a5500; border-radius: 8px; padding: 10px 14px; font-size: .82rem;
    font-weight: 600; line-height: 1.5; }

  /* ── ORDER LINES ── */
  .order-line { display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line); }
  .order-line:last-child { border-bottom: none; }
  .ol-name { flex: 1; font-size: .9rem; font-weight: 600; color: var(--text); }
  .ol-meta { font-size: .78rem; color: var(--muted); }
  .ol-sub  { font-size: .88rem; font-weight: 700; min-width: 72px; text-align: right; color: var(--gold); }
  .del-btn { background: none; border: none; color: #ccc; cursor: pointer;
    font-size: 1rem; padding: 4px 6px; border-radius: 5px; flex: none; }
  .del-btn:hover { color: var(--red); background: rgba(204,34,0,.08); }

  /* ── TOTALS ── */
  .totals { margin-top: 12px; }
  .trow { display: flex; justify-content: space-between; padding: 4px 0;
    font-size: .9rem; color: var(--muted); }
  .trow.grand { font-size: 1.1rem; font-weight: 800; color: var(--gold);
    border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }

  /* ── BOTTOM BAR ── */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--white);
    border-top: 2px solid var(--line); padding: 10px 16px; z-index: 10;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .bar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border: none; border-radius: 8px;
    font-size: .9rem; font-weight: 800; cursor: pointer; transition: .15s;
    letter-spacing: .04em; text-transform: uppercase; }
  .btn-primary   { background: var(--gold); color: #fff; }
  .btn-primary:hover   { background: var(--dark); }
  .btn-secondary { background: transparent; color: var(--gold); border: 1.5px solid var(--gold); }
  .btn-secondary:hover { background: #fffbee; }
  .btn:disabled  { opacity: .3; cursor: not-allowed; }

  /* ── HISTORY ── */
  .hist-item { background: var(--white); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; cursor: pointer; transition: .15s; }
  .hist-item:hover { border-color: var(--gold); background: #fffbee; }
  .hi-top { display: flex; justify-content: space-between; align-items: center; }
  .hi-name  { font-weight: 700; font-size: .95rem; color: var(--text); }
  .hi-total { font-weight: 800; color: var(--gold); }
  .hi-meta  { font-size: .76rem; color: var(--muted); margin-top: 4px; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 0; font-size: .95rem; }

  /* ── MODAL ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--white); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 20px; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 4px; color: var(--text); }
  .modal .close-btn { float: right; background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--muted); width: auto; padding: 0; }
  .modal .close-btn:hover { color: var(--text); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }

  /* ── PRINT ── */
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; position: static; padding: 30px; font-family: system-ui; }
    .print-header { text-align: center; margin-bottom: 16px; }
    .print-header h2 { font-size: 1.4rem; }
    .print-header p  { color: #555; font-size: .85rem; margin-top: 2px; }
    .print-divider { border: none; border-top: 1px dashed #aaa; margin: 12px 0; }
    .print-row { display: flex; justify-content: space-between; font-size: .9rem; padding: 3px 0; }
    .print-row.bold  { font-weight: 700; }
    .print-row.grand { font-size: 1.1rem; font-weight: 800; border-top: 2px solid #000; padding-top: 6px; margin-top: 4px; }
    .print-footer { text-align: center; margin-top: 20px; font-size: .78rem; color: #888; }
  }
</style>
</head>
<body>

<!-- ══ TABS ══ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('new')">New Order</div>
  <div class="tab" onclick="switchTab('history')">History</div>
</div>

<!-- ══ NEW ORDER PAGE ══ -->
<div class="page active" id="page-new">

  <!-- Customer Info -->
  <div class="card" style="margin-top:14px">
    <h3>Customer Info</h3>
    <div class="row2">
      <div class="field"><label>Name</label>
        <input id="c-name" placeholder="e.g. Ali bin Abu"></div>
      <div class="field"><label>Phone <span style="color:var(--red)">*</span></label>
        <input id="c-phone" type="tel" placeholder="e.g. 0123456789" inputmode="tel"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Event Date <span style="color:var(--red)">*</span></label>
        <input id="c-date" type="date"></div>
      <div class="field"><label>Time</label>
        <input id="c-time" type="time"></div>
    </div>
    <div class="field"><label>Delivery Address <span style="font-weight:400;color:var(--muted)">(leave blank = pickup)</span></label>
      <textarea id="c-address" rows="2" placeholder="Street, city, notes for driver"></textarea></div>
    <div class="field" style="margin-bottom:0"><label>Notes</label>
      <textarea id="c-notes" rows="2" placeholder="Allergies, special requests, etc."></textarea></div>
  </div>

  <!-- Session Selector -->
  <div class="card">
    <h3>Menu Sesi</h3>
    <div class="sess-row">
      <div class="sess-btn" id="sbtn-breakfast" onclick="openDialog('breakfast')">
        <span class="sess-emoji">🌅</span>
        <span class="sess-name">Sarapan</span>
        <span class="sess-sub">Breakfast</span>
        <span class="sess-badge" id="sbadge-breakfast">0</span>
      </div>
      <div class="sess-btn" id="sbtn-lunch" onclick="openDialog('lunch')">
        <span class="sess-emoji">☀️</span>
        <span class="sess-name">Tengahari</span>
        <span class="sess-sub">Lunch</span>
        <span class="sess-badge" id="sbadge-lunch">0</span>
      </div>
      <div class="sess-btn" id="sbtn-teatime" onclick="openDialog('teatime')">
        <span class="sess-emoji">🍵</span>
        <span class="sess-name">Petang</span>
        <span class="sess-sub">Tea Break</span>
        <span class="sess-badge" id="sbadge-teatime">0</span>
      </div>
      <div class="sess-btn" id="sbtn-servis" onclick="openDialog('servis')">
        <span class="sess-emoji">⭐</span>
        <span class="sess-name">Servis Lain</span>
        <span class="sess-sub">Other Services</span>
        <span class="sess-badge" id="sbadge-servis">0</span>
      </div>
    </div>
  </div>

  <!-- Order Summary -->
  <div class="card" id="summary-card">
    <h3>Order Summary</h3>
    <div id="order-lines"><p style="color:var(--muted);font-size:.85rem">No items added yet.</p></div>
    <div class="totals" id="totals-area" style="display:none">
      <div class="trow"><span>Subtotal</span><span id="t-sub">RM 0.00</span></div>
      <div class="trow grand"><span>Total</span><span id="t-total">RM 0.00</span></div>
    </div>
  </div>
</div>

<!-- ══ HISTORY PAGE ══ -->
<div class="page" id="page-history">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px">
    <h2 style="font-size:1.1rem;color:var(--text)">Quotation History</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:.8rem" onclick="importData()">Import JSON</button>
      <button class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:.8rem" onclick="exportData()">Export JSON</button>
    </div>
  </div>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">
  <div id="history-list"></div>
</div>

<!-- ══ SESSION DIALOG ══ -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-hd">
      <span class="sheet-title" id="dlg-title"></span>
      <button class="sheet-close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="sheet-body" id="dlg-body"></div>
    <div class="sheet-ft" style="flex-direction:column;gap:10px">
      <div class="dlg-warning" id="dlg-warning"></div>
      <div style="display:flex;gap:10px">
        <button class="btn-sheet-reset"   onclick="resetDialog()">Reset</button>
        <button class="btn-sheet-confirm" onclick="confirmDialog()">Add to Order</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ BOTTOM BAR ══ -->
<div class="bar">
  <div class="inner" id="bar-new">
    <button class="btn btn-primary" id="btn-save" onclick="saveAndPrint()" disabled>Confirm Order</button>
  </div>
</div>

<!-- ══ CONFIRM ORDER MODAL ══ -->
<div class="modal-bg" id="confirm-modal">
  <div class="modal">
    <button class="close-btn" onclick="closeConfirm()">✕</button>
    <h2 style="margin-bottom:4px">Confirm Order</h2>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:16px">Review before printing</p>
    <div id="confirm-preview" style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:16px"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-primary"   onclick="confirmAndPrint()">Print Quotation</button>
    </div>
  </div>
</div>

<!-- ══ DETAIL MODAL ══ -->
<div class="modal-bg" id="detail-modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2 id="m-title">Quotation</h2>
    <p id="m-meta" style="font-size:.8rem;color:var(--muted);margin-bottom:12px"></p>
    <div id="m-body"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="reloadOrder()">Load to Form</button>
      <button class="btn btn-primary"   onclick="printFromModal()">Print</button>
      <button class="btn btn-secondary" style="color:var(--red);border-color:var(--red)" onclick="deleteOrder()">Delete</button>
    </div>
  </div>
</div>

<!-- ══ PRINT AREA ══ -->
<div id="print-area" style="display:none"></div>

      { name: "Bihun Soto",    price: 7.00 },
      { name: "Laksa",         price: 7.00 },
      { name: "Kuih Muih",     sub: "Sebiji", price: 0.80 },
      { name: "Bebola Daging", sub: "Sebiji", price: 0.70 },
      { name: "Begerdil",      sub: "Sebiji", price: 1.20 },
      { name: "Papadom",       price: 1.00 },
    ],
    "t-drink": [
      { name: "Teh",               price: 1.80 },
      { name: "Teh 'O",            price: 1.50 },
      { name: "Kopi 'O",           price: 1.50 },
      { name: "Teh 'O Lemon",      price: 1.50 },
      { name: "Nescafe",           price: 2.00 },
      { name: "Air Mineral 250ml", price: 1.00 },
    ],
    // ── SERVIS LAIN
    "s-main": [
      { name: "Set Dome Premium", price: 150.00 },
      { name: "Peramusaji",       sub: "Seorang", price: 100.00 },
    ],
  };

  const SESSIONS = {
    breakfast: {
      emoji: "🌅", label: "Sarapan / Breakfast",
      sections: [
        { key: "b-makan",       title: "Makan" },
        { key: "b-addon",       title: "Add On", optional: true },
        { key: "b-drink",       title: "Air / Minuman" },
        { key: "b-drink-addon", title: "Add On Minuman", optional: true },
      ],
    },
    lunch: {
      emoji: "☀️", label: "Tengahari / Lunch",
      sections: [
        { key: "l-nasi",   title: "Nasi / Rice" },
        { key: "l-lauk",   title: "Lauk / Dishes" },
        { key: "l-sayur",  title: "Sayur / Vegetables", optional: true },
        { key: "l-salad",  title: "Salad & Ulam" },
        { key: "l-sambal", title: "Sambal" },
        { key: "l-buah",   title: "Buah" },
        { key: "l-air",    title: "Air / Minuman" },
      ],
    },
    teatime: {
      emoji: "🍵", label: "Minum Petang / Tea Break",
      sections: [
        { key: "t-makan", title: "Makan" },
        { key: "t-drink", title: "Air / Minuman" },
      ],
    },
    servis: {
      emoji: "⭐", label: "Servis Lain / Other Services",
      sections: [
        { key: "s-main", title: "Perkhidmatan" },
        {
          type: "info", title: "Perkhidmatan Kami",
          items: [
            "Set Buffet Premium — Pinggan, Cawan, Sudu & Garfu (Pakai Buang)",
            "Plastik Sampah",
            "Tisu",
          ],
        },
      ],
    },
  };

  // sessQty[session]['key-i'] = true/false
  const sessQty = { breakfast: {}, lunch: {}, teatime: {}, servis: {} };
  let activeSession = null;
  let tempQty = {};
  let currentId = null;
  let pendingQuotation = null;

  // ── DIALOG ──
  function openDialog(sess) {
    activeSession = sess;
    tempQty = { ...sessQty[sess] };

    const cfg = SESSIONS[sess];
    document.getElementById("dlg-title").textContent = cfg.emoji + "  " + cfg.label;

    const body = document.getElementById("dlg-body");
    body.innerHTML = "";

    cfg.sections.forEach(sec => {
      if (sec.type === "info") {
        const hd = document.createElement("div");
        hd.className = "dlg-sec-hd"; hd.textContent = sec.title;
        body.appendChild(hd);
        const card = document.createElement("div");
        card.style.cssText = "margin:4px 16px 8px;padding:12px 14px;background:#fffbee;border:1px solid #e8e0d0;border-radius:8px;";
        card.innerHTML = sec.items.map(t =>
          `<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.83rem;color:#1a1612">
             <span style="color:#b8922a;flex-shrink:0">✦</span><span>${t}</span></div>`
        ).join("");
        body.appendChild(card);
        return;
      }

      const items = MENU[sec.key];
      if (!items?.length) return;

      const hd = document.createElement("div");
      hd.className = "dlg-sec-hd";
      hd.innerHTML = sec.title + (sec.optional ? ` <span class="opt-pill">Optional</span>` : "");
      body.appendChild(hd);

      let lastGroup = null;
      items.forEach((item, i) => {
        const id = `${sec.key}-${i}`;
        if (item.group && item.group !== lastGroup) {
          lastGroup = item.group;
          const gl = document.createElement("div");
          gl.className = "dlg-grp-lbl"; gl.textContent = item.group;
          body.appendChild(gl);
        }
        const row = document.createElement("div");
        row.className = "dlg-item" + (tempQty[id] ? " checked" : "");
        row.dataset.sec = sec.key;
        row.innerHTML = `
          <div class="dlg-cb"></div>
          <div class="dlg-info">
            <div class="dlg-name">${item.name}</div>
            ${item.sub ? `<div class="dlg-sub">${item.sub}</div>` : ""}
            <div class="dlg-price">RM ${item.price.toFixed(2)}</div>
          </div>`;
        row.addEventListener("click", () => {
          const wasChecked = !!tempQty[id];
          // Radio: deselect all in section
          items.forEach((_, j) => { delete tempQty[`${sec.key}-${j}`]; });
          document.querySelectorAll(`.dlg-item[data-sec="${sec.key}"]`)
            .forEach(r => r.classList.remove("checked"));
          if (!wasChecked) {
            tempQty[id] = true;
            row.classList.add("checked");
          }
          document.getElementById("dlg-warning").style.display = "none";
        });
        body.appendChild(row);
      });
    });

    document.getElementById("dlg-warning").style.display = "none";
    document.getElementById("overlay").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeDialog() {
    document.getElementById("overlay").classList.remove("open");
    document.body.style.overflow = "";
    activeSession = null;
  }

  function resetDialog() {
    tempQty = {};
    document.querySelectorAll(".dlg-item.checked").forEach(r => r.classList.remove("checked"));
    document.getElementById("dlg-warning").style.display = "none";
  }

  function confirmDialog() {
    const cfg = SESSIONS[activeSession];
    const missing = [];
    cfg.sections.forEach(sec => {
      if (sec.type === "info" || sec.optional) return;
      const items = MENU[sec.key] || [];
      const hasAny = items.some((_, i) => tempQty[`${sec.key}-${i}`]);
      if (!hasAny) missing.push(sec.title);
    });
    if (missing.length) {
      const w = document.getElementById("dlg-warning");
      w.innerHTML = `⚠️ Sila pilih satu item dari: <strong>${missing.join(", ")}</strong>`;
      w.style.display = "block";
      return;
    }
    sessQty[activeSession] = { ...tempQty };
    const count = Object.values(sessQty[activeSession]).filter(Boolean).length;
    document.getElementById(`sbtn-${activeSession}`).classList.toggle("confirmed", count > 0);
    document.getElementById(`sbadge-${activeSession}`).textContent = count;
    closeDialog();
    renderSummary();
  }

  document.getElementById("overlay").addEventListener("click", e => {
    if (e.target.id === "overlay") closeDialog();
  });

  // ── GET ALL ORDER ITEMS ──
  function getAllItems() {
    const result = [];
    Object.entries(SESSIONS).forEach(([sess, cfg]) => {
      cfg.sections.forEach(sec => {
        if (sec.type === "info") return;
        (MENU[sec.key] || []).forEach((item, i) => {
          if (sessQty[sess][`${sec.key}-${i}`])
            result.push({ name: item.name, qty: 1, price: item.price });
        });
      });
    });
    return result;
  }

  // ── RENDER SUMMARY ──
  function renderSummary() {
    const lines   = document.getElementById("order-lines");
    const totArea = document.getElementById("totals-area");
    const all     = getAllItems();

    if (!all.length) {
      lines.innerHTML = `<p style="color:var(--muted);font-size:.85rem">No items added yet.</p>`;
      totArea.style.display = "none";
      document.getElementById("btn-save").disabled = true;
      return;
    }

    lines.innerHTML = all.map((it, idx) => `
      <div class="order-line">
        <div style="flex:1">
          <div class="ol-name">${it.name}</div>
          <div class="ol-meta">${it.qty} × RM ${it.price.toFixed(2)}</div>
        </div>
        <div class="ol-sub">RM ${(it.qty * it.price).toFixed(2)}</div>
        <button class="del-btn" onclick="removeItem(${idx})">✕</button>
      </div>`).join("");

    const sub = all.reduce((s, it) => s + it.qty * it.price, 0);
    document.getElementById("t-sub").textContent   = `RM ${sub.toFixed(2)}`;
    document.getElementById("t-total").textContent = `RM ${sub.toFixed(2)}`;
    totArea.style.display = "block";
    document.getElementById("btn-save").disabled = false;
  }

  function removeItem(idx) {
    const all  = getAllItems();
    const item = all[idx];
    let found  = false;
    for (const [sess, cfg] of Object.entries(SESSIONS)) {
      for (const sec of cfg.sections) {
        if (sec.type === "info") continue;
        const items = MENU[sec.key] || [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].name === item.name && items[i].price === item.price) {
            const key = `${sec.key}-${i}`;
          if (sessQty[sess][key]) {
                delete sessQty[sess][key];
                found = true; break;
            }
          }
        }
        if (found) break;
      }
      if (found) {
        const count = Object.values(sessQty[sess]).filter(Boolean).length;
          document.getElementById(`sbtn-${sess}`).classList.toggle("confirmed", count > 0);
          document.getElementById(`sbadge-${sess}`).textContent = count;
        break;
      }
    }
    renderSummary();
  }

  // ── TAB ──
  function switchTab(tab) {
    document.querySelectorAll(".tab").forEach((t, i) =>
      t.classList.toggle("active", (tab === "new" && i === 0) || (tab === "history" && i === 1)));
    document.getElementById("page-new").classList.toggle("active", tab === "new");
    document.getElementById("page-history").classList.toggle("active", tab === "history");
    document.getElementById("bar-new").style.display = tab === "new" ? "flex" : "none";
    if (tab === "history") renderHistory();
  }

  // ── DATE/TIME ──
  function fmtDate(val) {
    if (!val || val === "—") return val || "—";
    const [y,m,d] = val.split("-");
    if (!y || !m || !d) return val;
    return `${d}-${m}-${y}`;
  }
  function fmtTime(val) {
    if (!val || val === "—") return val || "—";
    const [hStr, mStr] = val.split(":");
    let h = parseInt(hStr, 10);
    return `${h%12||12}:${mStr} ${h>=12?"PM":"AM"}`;
  }
  function fmtDateTime(dateVal, timeVal) {
    const d = fmtDate(dateVal);
    const t = timeVal && timeVal !== "—" ? fmtTime(timeVal) : "";
    return t ? `${d}, ${t}` : d;
  }

  // ── BUILD QUOTATION ──
  function buildQuotation() {
    const items = getAllItems();
    return {
      id:        Date.now(),
      customer:  document.getElementById("c-name").value.trim()    || "—",
      phone:     document.getElementById("c-phone").value.trim()   || "—",
      date:      document.getElementById("c-date").value           || "—",
      time:      document.getElementById("c-time").value           || "—",
      address:   document.getElementById("c-address").value.trim() || "",
      notes:     document.getElementById("c-notes").value.trim()   || "",
      items,
      total:     items.reduce((s, it) => s + it.qty * it.price, 0),
      createdAt: new Date().toISOString(),
    };
  }

  // ── CONFIRM ORDER ──
  function saveAndPrint() {
    const q = buildQuotation();
    if (!validateForm(q)) return;
    pendingQuotation = q;

    const itemRows = q.items.map(it =>
      `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:.88rem">
         <span>${it.qty} × ${it.name}</span><span>RM ${(it.qty*it.price).toFixed(2)}</span></div>`
    ).join("");

    document.getElementById("confirm-preview").innerHTML = `
      <div style="font-weight:700;font-size:1rem;margin-bottom:2px">${q.customer}</div>
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:10px">
        ${q.phone} &nbsp;·&nbsp; ${fmtDateTime(q.date,q.time)}
        ${q.address ? "<br>"+q.address : ""}
      </div>
      <div style="border-top:1px solid var(--line);padding-top:10px;margin-bottom:8px">${itemRows}</div>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:1rem;
                  border-top:2px solid var(--line);padding-top:8px">
        <span>Total</span><span>RM ${q.total.toFixed(2)}</span>
      </div>
      ${q.notes?`<div style="margin-top:8px;font-size:.8rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)">Notes: ${q.notes}</div>`:""}`;

    document.getElementById("confirm-modal").classList.add("open");
  }

  function closeConfirm() {
    document.getElementById("confirm-modal").classList.remove("open");
    pendingQuotation = null;
  }

  function confirmAndPrint() {
    if (!pendingQuotation) return;
    const q = pendingQuotation;
    closeConfirm();
    saveToHistory(q);
    buildPrintArea(q);
    window.print();
    resetForm();
  }

  function buildPrintArea(q) {
    const itemRows = q.items.map(it =>
      `<div class="print-row"><span>${it.qty} × ${it.name}</span><span>RM ${(it.qty*it.price).toFixed(2)}</span></div>`
    ).join("");
    document.getElementById("print-area").innerHTML = `
      <div class="print-header">
        <h2>${BUSINESS_NAME}</h2><p>${BUSINESS_PHONE}</p>
        <p style="margin-top:6px;font-weight:700">QUOTATION</p>
        <p>#${q.id} &nbsp;·&nbsp; ${fmtDateTime(new Date(q.createdAt).toLocaleDateString("en-CA"),new Date(q.createdAt).toTimeString().slice(0,5))}</p>
      </div>
      <hr class="print-divider">
      <div class="print-row bold"><span>Customer</span><span>${q.customer}</span></div>
      <div class="print-row"><span>Phone</span><span>${q.phone}</span></div>
      <div class="print-row"><span>Event Date</span><span>${fmtDateTime(q.date,q.time)}</span></div>
      ${q.address?`<div class="print-row"><span>Delivery</span><span>${q.address}</span></div>`:""}
      <hr class="print-divider">
      ${itemRows}
      <div class="print-row grand"><span>TOTAL</span><span>RM ${q.total.toFixed(2)}</span></div>
      ${q.notes?`<hr class="print-divider"><div class="print-row"><span>Notes</span><span>${q.notes}</span></div>`:""}
      <div class="print-footer">Thank you for choosing ${BUSINESS_NAME}!</div>`;
  }

  // ── VALIDATION ──
  function validateForm(q) {
    if (!q.phone || q.phone === "—") {
      alert("Phone number is required."); document.getElementById("c-phone").focus(); return false;
    }
    if (q.phone.replace(/\D/g,"").length < 9) {
      alert("Please enter a valid Malaysian phone number."); document.getElementById("c-phone").focus(); return false;
    }
    if (!q.date || q.date === "—") {
      alert("Event date is required."); document.getElementById("c-date").focus(); return false;
    }
    if (!q.items.length) { alert("Please add at least one item."); return false; }
    return true;
  }

  // ── RESET ──
  function resetForm() {
    ["c-name","c-phone","c-date","c-time","c-address","c-notes"].forEach(id => {
      document.getElementById(id).value = "";
    });
    Object.keys(sessQty).forEach(sess => {
      sessQty[sess] = {};
      document.getElementById(`sbtn-${sess}`).classList.remove("confirmed");
      document.getElementById(`sbadge-${sess}`).textContent = "0";
    });
    renderSummary();
  }

  // ── HISTORY ──
  function getHistory() {
    try { return JSON.parse(localStorage.getItem("kz_pos_history") || "[]"); } catch { return []; }
  }
  function saveToHistory(q) {
    const h = getHistory(); h.unshift(q);
    localStorage.setItem("kz_pos_history", JSON.stringify(h));
  }
  function renderHistory() {
    const h = getHistory().slice().sort((a,b) => {
      const da = a.date && a.date!=="—" ? a.date : "0000-00-00";
      const db = b.date && b.date!=="—" ? b.date : "0000-00-00";
      return db.localeCompare(da);
    });
    const el = document.getElementById("history-list");
    if (!h.length) { el.innerHTML = `<div class="empty-state">No quotations saved yet.</div>`; return; }
    el.innerHTML = h.map(q => `
      <div class="hist-item" onclick="openModal(${q.id})">
        <div class="hi-top">
          <div class="hi-name">${q.customer}</div>
          <div class="hi-total">RM ${q.total.toFixed(2)}</div>
        </div>
        <div class="hi-meta">#${q.id} &nbsp;·&nbsp; ${q.phone} &nbsp;·&nbsp; ${fmtDate(q.date)}</div>
      </div>`).join("");
  }

  // ── MODAL ──
  function openModal(id) {
    const q = getHistory().find(x => x.id === id);
    if (!q) return;
    currentId = id;
    document.getElementById("m-title").textContent = `${q.customer} — RM ${q.total.toFixed(2)}`;
    document.getElementById("m-meta").textContent  =
      `#${q.id} · ${fmtDateTime(q.date,q.time)} · Saved ${fmtDate(new Date(q.createdAt).toLocaleDateString("en-CA"))}`;
    const rows = q.items.map(it =>
      `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:.88rem;color:var(--text)">
         <span>${it.qty} × ${it.name}</span><span style="color:var(--gold);font-weight:700">RM ${(it.qty*it.price).toFixed(2)}</span></div>`
    ).join("");
    document.getElementById("m-body").innerHTML = `
      <div style="font-size:.85rem;color:var(--muted);margin-bottom:8px">${q.phone}${q.address?" · "+q.address:""}</div>
      ${rows}
      <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:8px;
                  padding-top:8px;border-top:2px solid var(--line);color:var(--text)">
        <span>Total</span><span style="color:var(--gold)">RM ${q.total.toFixed(2)}</span>
      </div>
      ${q.notes?`<div style="margin-top:8px;font-size:.8rem;color:var(--muted)">Notes: ${q.notes}</div>`:""}`;
    document.getElementById("detail-modal").classList.add("open");
  }

  function closeModal() { document.getElementById("detail-modal").classList.remove("open"); currentId = null; }

  function printFromModal() {
    const q = getHistory().find(x => x.id === currentId);
    if (q) { buildPrintArea(q); window.print(); }
  }

  function reloadOrder() {
    const q = getHistory().find(x => x.id === currentId);
    if (!q) return;
    closeModal(); switchTab("new");
    document.getElementById("c-name").value    = q.customer === "—" ? "" : q.customer;
    document.getElementById("c-phone").value   = q.phone    === "—" ? "" : q.phone;
    document.getElementById("c-date").value    = q.date     === "—" ? "" : q.date;
    document.getElementById("c-time").value    = q.time     === "—" ? "" : q.time;
    document.getElementById("c-address").value = q.address;
    document.getElementById("c-notes").value   = q.notes;
    Object.keys(sessQty).forEach(sess => {
      sessQty[sess] = {};
      document.getElementById(`sbtn-${sess}`).classList.remove("confirmed");
      document.getElementById(`sbadge-${sess}`).textContent = "0";
    });
    q.items.forEach(it => {
      let matched = false;
      for (const [sess, cfg] of Object.entries(SESSIONS)) {
        for (const sec of cfg.sections) {
          if (sec.type === "info") continue;
          const items = MENU[sec.key] || [];
          const i = items.findIndex(m => m.name === it.name && m.price === it.price);
          if (i >= 0) {
            sessQty[sess][`${sec.key}-${i}`] = true;
            matched = true; break;
          }
        }
        if (matched) {
          const count = Object.values(sessQty[sess]).filter(Boolean).length;
          document.getElementById(`sbtn-${sess}`).classList.toggle("confirmed", count>0);
          document.getElementById(`sbadge-${sess}`).textContent = count;
          break;
        }
      }
    });
    renderSummary();
  }

  function deleteOrder() {
    if (!confirm("Delete this quotation?")) return;
    const h = getHistory().filter(x => x.id !== currentId);
    localStorage.setItem("kz_pos_history", JSON.stringify(h));
    closeModal(); renderHistory();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(getHistory(),null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `kz-catering-quotations-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importData() { document.getElementById("import-input").click(); }

  function handleImport(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error();
        const existing = getHistory();
        const ids = new Set(existing.map(q => q.id));
        const merged = [...imported.filter(q=>!ids.has(q.id)), ...existing].sort((a,b)=>b.id-a.id);
        localStorage.setItem("kz_pos_history", JSON.stringify(merged));
        document.getElementById("import-input").value = "";
        renderHistory();
        alert(`Import successful! ${merged.length - existing.length} new quotation(s) added.`);
      } catch { alert("Invalid file. Please select a valid backup JSON file."); }
    };
    reader.readAsText(file);
  }

  renderSummary();
</script>
